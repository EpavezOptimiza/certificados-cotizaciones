<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DICOM — Equifax</title>
<script src="/static/theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#1E3A5F;--sidebar-bg:#0d1b2e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;flex-direction:column}
.topnav{background:var(--sidebar-bg);padding:0 16px;height:50px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;flex-shrink:0}
.topnav::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--themed-bg-image,none);background-size:var(--themed-bg-size,cover);z-index:0}
.topnav>*{position:relative;z-index:1}
.back-btn{width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.back-btn:hover{background:rgba(255,255,255,.15)}
.nav-cur{color:#fff;font-weight:600;font-size:13px}
.main-content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%}
.page-header{display:flex;align-items:center;gap:14px}
.page-icon{width:44px;height:44px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.page-sub{font-size:12px;color:#64748b;margin-top:2px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px}
.card-title{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field input{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.field input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.btn{padding:11px 20px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;background:#7c3aed;color:#fff;transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.88}
.btn:disabled{opacity:.5;cursor:wait}
.btn-sec{background:#fff;color:#1E3A5F;border:1px solid #cbd5e1}
.aviso{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;font-size:12px;color:#92400e;line-height:1.55}
.log-body{padding:10px 14px;max-height:300px;overflow-y:auto;font-size:12px;line-height:1.8;font-family:ui-monospace,Consolas,monospace}
.log-t{color:#94a3b8;margin-right:6px}
.captura{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;display:none}
.captura img{width:100%;display:block}
</style>
</head>
<body>

<div class="topnav">
  <a class="back-btn" href="/" title="Volver al inicio">←</a>
  <span class="nav-cur">🔎 DICOM — Equifax</span>
</div>

<div class="main-content">
  <div class="page-header">
    <div class="page-icon">🔎</div>
    <div>
      <div class="page-title">DICOM — Equifax</div>
      <div class="page-sub">Acceso al portal de informes comerciales</div>
    </div>
  </div>

  <div class="aviso">
    <b>Por ahora solo se prueba el acceso</b> a <code>business.equifax.ca</code> (login en dos
    pasos: Username → Next → contraseña). Todavía no descarga ni compra documentos.
  </div>

  <div class="card">
    <div class="card-title">🔐 Credenciales del portal</div>
    <div class="field">
      <label>Username (el correo del usuario)</label>
      <input type="text" id="correo" placeholder="correo@empresa.cl" autocomplete="off">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="clave" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
      <button class="btn" id="btn-probar" onclick="probar()">▶ Probar acceso</button>
      <button class="btn btn-sec" onclick="guardar()">💾 Guardar credenciales</button>
    </div>
    <div id="msg-cfg" style="font-size:12px;margin-top:10px;display:none"></div>
  </div>

  <div class="card" id="log-card" style="display:none;padding:0">
    <div style="padding:12px 16px;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:700">
      📋 Resultado
    </div>
    <div class="log-body" id="log"></div>
    <div class="captura" id="captura-box">
      <img id="captura-img" alt="Captura del portal tras el acceso">
    </div>
  </div>
</div>

<script>
let _tid = null, _since = 0, _poll = null;

const esc = s => (s ?? '').toString()
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function cargarCfg(){
  try{
    const d = await (await fetch('/api/dicom/config')).json();
    if (d.correo) document.getElementById('correo').value = d.correo;
    if (d.tiene_clave) document.getElementById('clave').placeholder = '•••••••• (guardada)';
  }catch(e){}
}

async function guardar(){
  const correo = document.getElementById('correo').value.trim();
  const clave  = document.getElementById('clave').value.trim();
  const msg = document.getElementById('msg-cfg');
  try{
    await fetch('/api/dicom/config', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({correo, clave})});
    msg.style.display = 'block'; msg.style.color = '#047857';
    msg.textContent = '✓ Credenciales guardadas';
  }catch(e){
    msg.style.display = 'block'; msg.style.color = '#b91c1c';
    msg.textContent = '✗ No se pudieron guardar';
  }
}

async function probar(){
  const btn = document.getElementById('btn-probar');
  btn.disabled = true; btn.textContent = '⏳ Entrando…';
  document.getElementById('log-card').style.display = '';
  document.getElementById('log').innerHTML = '';
  document.getElementById('captura-box').style.display = 'none';
  try{
    const r = await fetch('/api/dicom/probar_login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({correo: document.getElementById('correo').value.trim(),
                            clave:  document.getElementById('clave').value.trim()})});
    const d = await r.json();
    if (d.error){
      alert(d.error);
      btn.disabled = false; btn.textContent = '▶ Probar acceso';
      return;
    }
    _tid = d.task_id; _since = 0;
    clearInterval(_poll);
    _poll = setInterval(consultar, 1500);
  }catch(e){
    alert('Error: ' + e);
    btn.disabled = false; btn.textContent = '▶ Probar acceso';
  }
}

async function consultar(){
  if (!_tid) return;
  try{
    const d = await (await fetch(`/api/dicom/tarea/${_tid}?since=${_since}`)).json();
    const cont = document.getElementById('log');
    (d.logs || []).forEach(l => {
      const color = l.tipo === 'ok' ? '#047857' : l.tipo === 'err' ? '#b91c1c'
                  : l.tipo === 'warn' ? '#b45309' : '#334155';
      cont.insertAdjacentHTML('beforeend',
        `<div style="color:${color}"><span class="log-t">${l.t}</span>${esc(l.msg)}</div>`);
    });
    _since += (d.logs || []).length;
    cont.scrollTop = cont.scrollHeight;
    if (d.done){
      clearInterval(_poll);
      const btn = document.getElementById('btn-probar');
      btn.disabled = false; btn.textContent = '▶ Probar acceso';
      if (d.captura){
        document.getElementById('captura-img').src =
          '/api/dicom/captura/' + d.captura + '?t=' + Date.now();
        document.getElementById('captura-box').style.display = 'block';
      }
    }
  }catch(e){}
}

cargarCfg();
</script>
</body>
</html>
